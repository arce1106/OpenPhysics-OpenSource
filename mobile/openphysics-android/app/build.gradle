plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def releaseKeystorePath = System.getenv('OPENPHYSICS_ANDROID_KEYSTORE_PATH')?.trim()
def releaseStorePassword = System.getenv('OPENPHYSICS_ANDROID_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('OPENPHYSICS_ANDROID_KEY_ALIAS')?.trim()
def releaseKeyPassword = System.getenv('OPENPHYSICS_ANDROID_KEY_PASSWORD')
def releaseSigningReady = [
    releaseKeystorePath,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
].every { value -> value != null && !value.isEmpty() }
def releaseTaskRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('release')
}
// Explicit local device testing only. Normal builds keep using the published pane.
def panePreviewDir = project.findProperty('OPENPHYSICS_PANE_PREVIEW_DIR')?.toString()?.trim()
def panePreviewEnabled = panePreviewDir != null && !panePreviewDir.isEmpty()
def panePreviewAssets = layout.buildDirectory.dir('generated/panePreviewAssets')
if (panePreviewEnabled) {
    if (!file("${panePreviewDir}/index.html").isFile() || !file("${panePreviewDir}/assets").isDirectory()) {
        throw new GradleException('Build the learning-content pane before setting OPENPHYSICS_PANE_PREVIEW_DIR.')
    }
    tasks.register('syncPanePreviewAssets', Sync) {
        from(panePreviewDir) { into 'panes/learning-content' }
        into panePreviewAssets
    }
}

android {
    namespace 'cn.openphysics.androidapp'
    compileSdk 36

    def cloudApiBaseUrl = project.findProperty("OPENPHYSICS_API_BASE_URL") ?: "https://openphysics.example/api/student"
    def debugApiBaseUrl = project.findProperty("OPENPHYSICS_API_BASE_URL") ?: "http://10.0.2.2:8010/api/student"

    defaultConfig {
        applicationId 'org.example.openphysics.android'
        minSdk 24
        targetSdk 36
        testInstrumentationRunner 'cn.openphysics.androidapp.DiagnosticSmokeInstrumentation'
        versionCode 1
        versionName panePreviewEnabled ? '0.1.0-preview' : '0.1.0'
        buildConfigField 'boolean', 'BUNDLED_PANE_PREVIEW', panePreviewEnabled.toString()
        buildConfigField 'String', 'API_BASE_URL', "\"${cloudApiBaseUrl}\""

    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            // An isolated app for device smoke checks; never replaces the student's app.
            if (project.findProperty('OPENPHYSICS_DEVICE_SMOKE')?.toString()?.toBoolean() == true) {
                applicationIdSuffix '.devicetest'
            }
            buildConfigField 'String', 'API_BASE_URL', "\"${debugApiBaseUrl}\""


        }
        release {
            buildConfigField 'String', 'API_BASE_URL', "\"${cloudApiBaseUrl}\""
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    if (panePreviewEnabled) {
        sourceSets.main.assets.srcDir(panePreviewAssets)
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

if (releaseTaskRequested && panePreviewEnabled) {
    throw new GradleException('OPENPHYSICS_PANE_PREVIEW_DIR is for local debug builds only; remove it before building a release APK or bundle.')
}
if (releaseTaskRequested && !releaseSigningReady) {
    throw new GradleException(
        'Release signing is required. Use scripts/build-release.sh or provide the OPENPHYSICS_ANDROID_* environment variables.'
    )
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    // Handwriting: Jetpack Ink draws strokes with low latency; the predictor hides the remaining lag.
    implementation 'androidx.ink:ink-authoring:1.0.0'
    implementation 'androidx.ink:ink-brush:1.0.0'
    implementation 'androidx.ink:ink-geometry:1.0.0'
    implementation 'androidx.ink:ink-rendering:1.0.0'
    implementation 'androidx.ink:ink-strokes:1.0.0'
    implementation 'androidx.input:input-motionprediction:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.webkit:webkit:1.12.1'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

tasks.register('verifyKatexAssets') {
    group = 'verification'
    description = 'Verifies local KaTeX CSS and font assets used by Android rendered rich content.'

    doLast {
        def skipRequested = project.findProperty('openphysics.skipKatexAssetCheck')?.toString()?.toBoolean() == true
        def requestedTasks = gradle.startParameter.taskNames.collect { it.toLowerCase() }
        def releaseRequested = requestedTasks.any { it.contains('release') }
        if (skipRequested && !releaseRequested) {
            logger.lifecycle('Skipping KaTeX asset verification for non-release build.')
            return
        }

        def katexDir = file('src/main/assets/katex')
        def cssFile = file("${katexDir}/katex.min.css")
        def fontsDir = file("${katexDir}/fonts")
        if (!cssFile.isFile()) {
            throw new GradleException("Missing local KaTeX CSS: ${cssFile}")
        }
        if (!fontsDir.isDirectory()) {
            throw new GradleException("Missing local KaTeX fonts directory: ${fontsDir}")
        }

        def woff2Files = fileTree(fontsDir) {
            include '**/*.woff2'
        }.files
        if (woff2Files.size() < 4) {
            throw new GradleException("Expected several local KaTeX .woff2 fonts, found ${woff2Files.size()}")
        }
        def legacyFontFiles = fileTree(fontsDir) {
            include '**/*.woff'
            include '**/*.ttf'
        }.files
        if (!legacyFontFiles.isEmpty()) {
            throw new GradleException("KaTeX must use WOFF2-only fonts; remove ${legacyFontFiles.size()} legacy font files.")
        }

        def css = cssFile.getText('UTF-8')
        if (!css.contains('.katex')) {
            throw new GradleException('Local KaTeX CSS does not contain .katex rules.')
        }
        if (!css.contains('font-face')) {
            throw new GradleException('Local KaTeX CSS does not contain font-face declarations.')
        }
        if (css.contains('format("woff")') || css.contains('format("truetype")')) {
            throw new GradleException('Local KaTeX CSS must not reference legacy WOFF or TTF fonts.')
        }
    }
}

tasks.register('verifyNoAndroidMathJaxRuntime') {
    group = 'verification'
    description = 'Fails when Android main sources or assets reference the old MathJax runtime.'

    doLast {
        def forbidden = ['MathJax', 'tex-svg.js', 'CdnMathJax', 'LocalMathJax']
        def roots = [file('src/main/java'), file('src/main/assets')]
        def matches = []
        roots.findAll { it.exists() }.each { root ->
            fileTree(root) {
                include '**/*.kt'
                include '**/*.java'
                include '**/*.js'
                include '**/*.html'
                include '**/*.json'
            }.files.each { source ->
                source.readLines('UTF-8').eachWithIndex { line, index ->
                    def token = forbidden.find { line.contains(it) }
                    if (token != null) {
                        matches << "${source.relativeTo(root)}:${index + 1}:${token}"
                    }
                }
            }
        }
        if (!matches.isEmpty()) {
            throw new GradleException("Android MathJax runtime references remain:\n${matches.join('\n')}")
        }
    }
}

tasks.named('preBuild') {
    if (panePreviewEnabled) {
        dependsOn tasks.named('syncPanePreviewAssets')
    }
    dependsOn tasks.named('verifyKatexAssets')
    dependsOn tasks.named('verifyNoAndroidMathJaxRuntime')
}
